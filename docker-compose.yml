# PlasticWatch — local docker-compose is the PRIMARY dev/deploy target (CLAUDE.md §3).
# Copy .env.example to .env before running: `cp .env.example .env && make up`.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: plasticwatch-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build: ./backend
    container_name: plasticwatch-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network the db host is the service name, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Bind mount for --reload; uploads persist on the host (gitignored).
      - ./backend:/app
    restart: unless-stopped

volumes:
  pgdata:
