<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlasticWatch</title>
    <script>
      // Single Page Application fallback for static site hosts (Render / GitHub Pages).
      // Automatically forwards direct URL paths (e.g. /dashboard or /report) to the client-side router.
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace('/#' + path + search + hash);
    </script>
  </head>

      <p style="font-size: 14px;">Loading page…</p>
    </div>
  </body>
</html>
