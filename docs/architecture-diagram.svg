<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>

  <!-- title -->
  <text x="60" y="56" font-size="30" font-weight="700" fill="#0f172a" letter-spacing="-0.5">PlasticWatch — Architecture &amp; Tech Stack</text>
  <text x="60" y="84" font-size="16" fill="#475569">AI-GIS system that turns citizen photos into ranked plastic-waste hotspots — with a human verification gate at every decision.</text>
  <rect x="60" y="98" width="86" height="4" rx="2" fill="#0d9488"/>

  <!-- MAIN COLUMN -->

  <!-- actors -->
  <g>
    <rect x="60" y="128" width="512" height="70" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <circle cx="100" cy="163" r="15" fill="#0d9488"/>
    <text x="100" y="169" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
    <text x="128" y="157" font-size="17" font-weight="700" fill="#0f172a">Citizen</text>
    <text x="128" y="180" font-size="14" fill="#475569">Photographs waste · pins location · follows progress</text>

    <rect x="598" y="128" width="532" height="70" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <circle cx="638" cy="163" r="15" fill="#0f766e"/>
    <text x="638" y="169" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <text x="666" y="157" font-size="17" font-weight="700" fill="#0f172a">Ward Authority</text>
    <text x="666" y="180" font-size="14" fill="#475569">Verifies evidence · approves cleanup · routes crews</text>
  </g>

  <path d="M595,210 L595,236" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- frontend -->
  <g>
    <rect x="60" y="240" width="1070" height="128" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="240" width="6" height="128" rx="3" fill="#0d9488"/>
    <text x="86" y="270" font-size="19" font-weight="700" fill="#0f172a">Frontend — Single-page app</text>
    <text x="1106" y="270" font-size="13" font-weight="600" fill="#0d9488" text-anchor="end">BROWSER</text>

    <g font-size="14">
      <rect x="86" y="288" width="196" height="60" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="100" y="312" font-weight="700" fill="#0f172a">React 19 + Vite</text>
      <text x="100" y="333" fill="#475569">TypeScript · React Router</text>

      <rect x="298" y="288" width="196" height="60" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="312" y="312" font-weight="700" fill="#0f172a">Tailwind v4</text>
      <text x="312" y="333" fill="#475569">CSS-var design tokens</text>

      <rect x="510" y="288" width="210" height="60" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="524" y="312" font-weight="700" fill="#0f172a">Leaflet + heat</text>
      <text x="524" y="333" fill="#475569">Map · hotspots · heatmap</text>

      <rect x="736" y="288" width="180" height="60" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="750" y="312" font-weight="700" fill="#0f172a">Recharts</text>
      <text x="750" y="333" fill="#475569">KPI &amp; trend charts</text>

      <rect x="932" y="288" width="174" height="60" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="946" y="312" font-weight="700" fill="#0f172a">Pages</text>
      <text x="946" y="333" fill="#475569">Report · Map · Review</text>
    </g>
  </g>

  <path d="M595,368 L595,398" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="608" y="389" font-size="13" font-weight="600" fill="#64748b">REST / JSON · multipart photo upload</text>

  <!-- api -->
  <g>
    <rect x="60" y="402" width="1070" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="402" width="6" height="104" rx="3" fill="#0d9488"/>
    <text x="86" y="432" font-size="19" font-weight="700" fill="#0f172a">API — FastAPI (Python 3.11)</text>
    <text x="1106" y="432" font-size="13" font-weight="600" fill="#0d9488" text-anchor="end">ROUTERS</text>

    <g font-size="13.5" font-weight="600">
      <rect x="86" y="452" width="104" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="138" y="474" fill="#0f766e" text-anchor="middle">auth</text>
      <rect x="200" y="452" width="118" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="259" y="474" fill="#0f766e" text-anchor="middle">reports</text>
      <rect x="328" y="452" width="124" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="390" y="474" fill="#0f766e" text-anchor="middle">hotspots</text>
      <rect x="462" y="452" width="104" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="514" y="474" fill="#0f766e" text-anchor="middle">tasks</text>
      <rect x="576" y="452" width="128" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="640" y="474" fill="#0f766e" text-anchor="middle">analytics</text>
      <rect x="714" y="452" width="90" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="759" y="474" fill="#0f766e" text-anchor="middle">geo</text>
      <rect x="814" y="452" width="150" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="889" y="474" fill="#0f766e" text-anchor="middle">before_after</text>
      <rect x="974" y="452" width="104" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="1026" y="474" fill="#0f766e" text-anchor="middle">admin</text>
    </g>
  </g>

  <path d="M595,506 L595,532" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- services -->
  <g>
    <rect x="60" y="536" width="1070" height="136" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="536" width="6" height="136" rx="3" fill="#0d9488"/>
    <text x="86" y="566" font-size="19" font-weight="700" fill="#0f172a">Domain services — where the intelligence lives</text>
    <text x="1106" y="566" font-size="13" font-weight="600" fill="#0d9488" text-anchor="end">app/services</text>

    <g font-size="13.5">
      <rect x="86" y="584" width="164" height="70" rx="9" fill="#ecfeff" stroke="#a5f3fc"/>
      <text x="100" y="607" font-weight="700" fill="#0f172a">detector</text>
      <text x="100" y="626" fill="#475569">YOLO11s — boxes</text>
      <text x="100" y="644" fill="#475569">+ “likely plastic”</text>

      <rect x="262" y="584" width="150" height="70" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="276" y="607" font-weight="700" fill="#0f172a">quality</text>
      <text x="276" y="626" fill="#475569">Blur / dark gate</text>
      <text x="276" y="644" fill="#475569">before storing</text>

      <rect x="424" y="584" width="164" height="70" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="438" y="607" font-weight="700" fill="#0f172a">dedupe</text>
      <text x="438" y="626" fill="#475569">pHash + radius</text>
      <text x="438" y="644" fill="#475569">merge duplicates</text>

      <rect x="600" y="584" width="156" height="70" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="614" y="607" font-weight="700" fill="#0f172a">scoring</text>
      <text x="614" y="626" fill="#475569">Impact rank</text>
      <text x="614" y="644" fill="#475569">4 weighted parts</text>

      <rect x="768" y="584" width="168" height="70" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="782" y="607" font-weight="700" fill="#0f172a">geo_context</text>
      <text x="782" y="626" fill="#475569">Drain / water /</text>
      <text x="782" y="644" fill="#475569">ward proximity</text>

      <rect x="948" y="584" width="158" height="70" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="962" y="607" font-weight="700" fill="#0f172a">routing</text>
      <text x="962" y="626" fill="#475569">ORS optimise</text>
      <text x="962" y="644" fill="#475569">+ greedy fallback</text>
    </g>
  </g>

  <path d="M595,672 L595,698" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- data -->
  <g>
    <rect x="60" y="702" width="1070" height="96" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="702" width="6" height="96" rx="3" fill="#0f766e"/>
    <text x="86" y="732" font-size="19" font-weight="700" fill="#0f172a">Data layer</text>
    <text x="1106" y="732" font-size="13" font-weight="600" fill="#0d9488" text-anchor="end">PERSISTENCE</text>

    <g font-size="14">
      <rect x="86" y="748" width="470" height="36" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="100" y="772"><tspan font-weight="700" fill="#0f172a">PostgreSQL + PostGIS</tspan><tspan fill="#475569">  ·  SRID 4326 · GiST index · ::geography</tspan></text>

      <rect x="572" y="748" width="300" height="36" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="586" y="772"><tspan font-weight="700" fill="#0f172a">Local disk</tspan><tspan fill="#475569">  ·  photos + annotated</tspan></text>

      <rect x="888" y="748" width="218" height="36" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="902" y="772"><tspan font-weight="700" fill="#0f172a">Docker Compose</tspan></text>
    </g>
  </g>

  <!-- EXTERNAL COLUMN -->
  <g>
    <rect x="1170" y="240" width="370" height="558" rx="14" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="1196" y="272" font-size="17" font-weight="700" fill="#0f172a">External services</text>
    <text x="1196" y="294" font-size="13" fill="#64748b">Third-party, called at runtime</text>

    <g font-size="14">
      <rect x="1196" y="312" width="318" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="1212" y="338" font-size="15" font-weight="700" fill="#0f172a">OpenStreetMap tiles</text>
      <text x="1212" y="359" fill="#475569">Basemap for the Leaflet map,</text>
      <text x="1212" y="378" fill="#475569">desaturated so red = critical.</text>

      <rect x="1196" y="406" width="318" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="1212" y="432" font-size="15" font-weight="700" fill="#0f172a">OpenRouteService</text>
      <text x="1212" y="453" fill="#475569">/optimization for cleanup</text>
      <text x="1212" y="472" fill="#475569">routes — greedy NN fallback.</text>

      <rect x="1196" y="500" width="318" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="1212" y="526" font-size="15" font-weight="700" fill="#0f172a">Overpass / OSM extracts</text>
      <text x="1212" y="547" fill="#475569">Drains, water bodies and ward</text>
      <text x="1212" y="566" fill="#475569">polygons, loaded into PostGIS.</text>

      <rect x="1196" y="594" width="318" height="88" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="1212" y="620" font-size="15" font-weight="700" fill="#0f172a">TACO dataset</text>
      <text x="1212" y="641" fill="#475569">Training data for the detector.</text>
      <text x="1212" y="660" fill="#475569">“Plastic” comes from a category</text>
      <text x="1212" y="676" fill="#475569">map, not a raw TACO label.</text>
    </g>

    <rect x="1196" y="696" width="318" height="86" rx="10" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="1212" y="722" font-size="15" font-weight="700" fill="#92400e">Honesty guarantees</text>
    <text x="1212" y="743" font-size="13.5" fill="#92400e">· Always “likely plastic”, never “plastic”</text>
    <text x="1212" y="761" font-size="13.5" fill="#92400e">· Simulated demo data is badged</text>
    <text x="1212" y="777" font-size="13.5" fill="#92400e">· Never attributes who is responsible</text>
  </g>

  <!-- PIPELINE STRIP -->
  <g>
    <rect x="60" y="822" width="1480" height="126" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="86" y="852" font-size="17" font-weight="700" fill="#0f172a">What happens to one photo</text>
    <text x="313" y="852" font-size="14" fill="#64748b">— the report pipeline, in order</text>

    <g font-size="13" text-anchor="middle">
      <rect x="86" y="868" width="168" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="170" y="891" font-weight="700" fill="#0f172a">1 · Photo in</text>
      <text x="170" y="911" fill="#475569">GPS / EXIF / pin</text>

      <rect x="274" y="868" width="168" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="358" y="891" font-weight="700" fill="#0f172a">2 · Quality gate</text>
      <text x="358" y="911" fill="#475569">blur &amp; darkness</text>

      <rect x="462" y="868" width="168" height="60" rx="9" fill="#ecfeff" stroke="#0d9488"/>
      <text x="546" y="891" font-weight="700" fill="#0f766e">3 · Detect</text>
      <text x="546" y="911" fill="#475569">YOLO11s boxes</text>

      <rect x="650" y="868" width="168" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="734" y="891" font-weight="700" fill="#0f172a">4 · Dedupe</text>
      <text x="734" y="911" fill="#475569">pHash + radius</text>

      <rect x="838" y="868" width="168" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="922" y="891" font-weight="700" fill="#0f172a">5 · Cluster</text>
      <text x="922" y="911" fill="#475569">into a hotspot</text>

      <rect x="1026" y="868" width="168" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="1110" y="891" font-weight="700" fill="#0f172a">6 · Score</text>
      <text x="1110" y="911" fill="#475569">rank by Impact</text>

      <rect x="1214" y="868" width="300" height="60" rx="9" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
      <text x="1364" y="891" font-weight="700" fill="#0f766e">7 · Human verification gate</text>
      <text x="1364" y="911" fill="#475569">no auto-verify · no auto-resolve</text>
    </g>

    <g stroke="#0d9488" stroke-width="2" marker-end="url(#art)" fill="none">
      <path d="M258,898 L270,898"/><path d="M446,898 L458,898"/><path d="M634,898 L646,898"/>
      <path d="M822,898 L834,898"/><path d="M1010,898 L1022,898"/><path d="M1198,898 L1210,898"/>
    </g>
  </g>
</svg>
