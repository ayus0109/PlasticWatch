<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1600" height="1040" fill="#ffffff"/>

  <!-- title -->
  <text x="60" y="56" font-size="30" font-weight="700" fill="#0f172a" letter-spacing="-0.5">PlasticWatch — Architecture &amp; Tech Stack</text>
  <text x="60" y="84" font-size="16" fill="#475569">Citizen photos become ranked plastic-waste hotspots. A human verifies every decision — nothing closes automatically.</text>
  <rect x="60" y="98" width="86" height="4" rx="2" fill="#0d9488"/>

  <!-- actors -->
  <g>
    <rect x="60" y="128" width="512" height="70" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <circle cx="100" cy="163" r="15" fill="#0d9488"/>
    <text x="100" y="169" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
    <text x="128" y="157" font-size="17" font-weight="700" fill="#0f172a">Citizen</text>
    <text x="128" y="180" font-size="14" fill="#475569">Photographs waste · pins location · follows progress</text>

    <rect x="598" y="128" width="532" height="70" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <circle cx="638" cy="163" r="15" fill="#0f766e"/>
    <text x="638" y="169" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <text x="666" y="157" font-size="17" font-weight="700" fill="#0f172a">Ward Authority</text>
    <text x="666" y="180" font-size="14" fill="#475569">Verifies evidence · approves cleanup · routes crews</text>
  </g>

  <path d="M595,200 L595,226" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- frontend -->
  <g>
    <rect x="60" y="232" width="1070" height="132" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="232" width="6" height="132" rx="3" fill="#0d9488"/>
    <text x="86" y="262" font-size="19" font-weight="700" fill="#0f172a">Frontend — single-page app</text>
    <text x="1106" y="262" font-size="13" font-weight="600" fill="#0d9488" text-anchor="end">BROWSER</text>

    <g font-size="13.5">
      <rect x="86" y="282" width="198" height="62" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="100" y="306" font-size="14.5" font-weight="700" fill="#0f172a">React 19.3 · Vite 7.3</text>
      <text x="100" y="328" fill="#475569">TypeScript 5.9</text>

      <rect x="300" y="282" width="198" height="62" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="314" y="306" font-size="14.5" font-weight="700" fill="#0f172a">Tailwind CSS 4.3</text>
      <text x="314" y="328" fill="#475569">CSS-variable tokens</text>

      <rect x="514" y="282" width="206" height="62" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="528" y="306" font-size="14.5" font-weight="700" fill="#0f172a">Leaflet 1.9 + heat</text>
      <text x="528" y="328" fill="#475569">Map · markers · heatmap</text>

      <rect x="736" y="282" width="182" height="62" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="750" y="306" font-size="14.5" font-weight="700" fill="#0f172a">Recharts 3.10</text>
      <text x="750" y="328" fill="#475569">KPI &amp; trend charts</text>

      <rect x="934" y="282" width="172" height="62" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="948" y="306" font-size="14.5" font-weight="700" fill="#0f172a">Router 7.18</text>
      <text x="948" y="328" fill="#475569">Report · Map · Review</text>
    </g>
  </g>

  <path d="M595,364 L595,392" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="608" y="384" font-size="13" font-weight="600" fill="#64748b">REST / JSON · multipart photo upload</text>

  <!-- api -->
  <g>
    <rect x="60" y="398" width="1070" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="398" width="6" height="104" rx="3" fill="#0d9488"/>
    <text x="86" y="428" font-size="19" font-weight="700" fill="#0f172a">API — FastAPI 0.115 · Python 3.14 · SQLAlchemy 2.0</text>
    <text x="1106" y="428" font-size="13" font-weight="600" fill="#0d9488" text-anchor="end">8 ROUTERS</text>

    <g font-size="13.5" font-weight="600">
      <rect x="86" y="448" width="104" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="138" y="470" fill="#0f766e" text-anchor="middle">auth</text>
      <rect x="200" y="448" width="118" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="259" y="470" fill="#0f766e" text-anchor="middle">reports</text>
      <rect x="328" y="448" width="124" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="390" y="470" fill="#0f766e" text-anchor="middle">hotspots</text>
      <rect x="462" y="448" width="104" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="514" y="470" fill="#0f766e" text-anchor="middle">tasks</text>
      <rect x="576" y="448" width="128" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="640" y="470" fill="#0f766e" text-anchor="middle">analytics</text>
      <rect x="714" y="448" width="90" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="759" y="470" fill="#0f766e" text-anchor="middle">geo</text>
      <rect x="814" y="448" width="150" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="889" y="470" fill="#0f766e" text-anchor="middle">before_after</text>
      <rect x="974" y="448" width="104" height="34" rx="17" fill="#f0fdfa" stroke="#99f6e4"/><text x="1026" y="470" fill="#0f766e" text-anchor="middle">admin</text>
    </g>
  </g>

  <path d="M595,502 L595,528" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- services -->
  <g>
    <rect x="60" y="532" width="1070" height="136" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="532" width="6" height="136" rx="3" fill="#0d9488"/>
    <text x="86" y="562" font-size="19" font-weight="700" fill="#0f172a">Domain services — where the intelligence lives</text>
    <text x="1106" y="562" font-size="13" font-weight="600" fill="#0d9488" text-anchor="end">app/services</text>

    <g font-size="13.5">
      <rect x="86" y="580" width="164" height="70" rx="9" fill="#ecfeff" stroke="#0d9488" stroke-width="1.5"/>
      <text x="100" y="603" font-weight="700" fill="#0f766e">detector</text>
      <text x="100" y="622" fill="#475569">YOLO11s inference</text>
      <text x="100" y="640" fill="#475569">→ “likely plastic”</text>

      <rect x="262" y="580" width="150" height="70" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="276" y="603" font-weight="700" fill="#0f172a">quality</text>
      <text x="276" y="622" fill="#475569">Blur / darkness</text>
      <text x="276" y="640" fill="#475569">gate before store</text>

      <rect x="424" y="580" width="164" height="70" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="438" y="603" font-weight="700" fill="#0f172a">dedupe</text>
      <text x="438" y="622" fill="#475569">pHash + radius</text>
      <text x="438" y="640" fill="#475569">merge duplicates</text>

      <rect x="600" y="580" width="156" height="70" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="614" y="603" font-weight="700" fill="#0f172a">scoring</text>
      <text x="614" y="622" fill="#475569">Impact rank —</text>
      <text x="614" y="640" fill="#475569">4 weighted parts</text>

      <rect x="768" y="580" width="168" height="70" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="782" y="603" font-weight="700" fill="#0f172a">geo_context</text>
      <text x="782" y="622" fill="#475569">Drain / water /</text>
      <text x="782" y="640" fill="#475569">ward proximity</text>

      <rect x="948" y="580" width="158" height="70" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="962" y="603" font-weight="700" fill="#0f172a">routing</text>
      <text x="962" y="622" fill="#475569">ORS optimise</text>
      <text x="962" y="640" fill="#475569">+ greedy fallback</text>
    </g>
  </g>

  <!-- AI band -->
  <g>
    <rect x="60" y="678" width="1070" height="64" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="86" y="705" font-size="15.5" font-weight="700" fill="#0f766e">Detection stack</text>
    <text x="86" y="726" font-size="13" fill="#0f766e">inside detector</text>

    <g font-size="13">
      <rect x="216" y="690" width="196" height="40" rx="8" fill="#ffffff" stroke="#99f6e4"/>
      <text x="230" y="707" font-weight="700" fill="#0f172a">Ultralytics 8.3</text>
      <text x="230" y="723" fill="#475569">YOLO11s · detection only</text>

      <rect x="424" y="690" width="176" height="40" rx="8" fill="#ffffff" stroke="#99f6e4"/>
      <text x="438" y="707" font-weight="700" fill="#0f172a">PyTorch 2.14</text>
      <text x="438" y="723" fill="#475569">CPU inference ~0.4 s</text>

      <rect x="612" y="690" width="228" height="40" rx="8" fill="#ffffff" stroke="#99f6e4"/>
      <text x="626" y="707" font-weight="700" fill="#0f172a">COCO → SPEC class map</text>
      <text x="626" y="723" fill="#475569">bottle · bag/film · packaging · other</text>

      <rect x="852" y="690" width="254" height="40" rx="8" fill="#ffffff" stroke="#fbbf24"/>
      <text x="866" y="707" font-weight="700" fill="#92400e">Safety filter (§2.4)</text>
      <text x="866" y="723" fill="#92400e">people · vehicles · plates → dropped</text>
    </g>
  </g>

  <path d="M595,742 L595,766" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- data -->
  <g>
    <rect x="60" y="772" width="1070" height="96" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="772" width="6" height="96" rx="3" fill="#0f766e"/>
    <text x="86" y="802" font-size="19" font-weight="700" fill="#0f172a">Data layer</text>
    <text x="1106" y="802" font-size="13" font-weight="600" fill="#0d9488" text-anchor="end">PERSISTENCE</text>

    <g font-size="14">
      <rect x="86" y="818" width="470" height="36" rx="9" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="100" y="842"><tspan font-weight="700" fill="#0f172a">PostgreSQL + PostGIS</tspan><tspan fill="#475569">  ·  SRID 4326 · GiST · ::geography</tspan></text>

      <rect x="572" y="818" width="300" height="36" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="586" y="842"><tspan font-weight="700" fill="#0f172a">Local disk</tspan><tspan fill="#475569">  ·  photos + annotated</tspan></text>

      <rect x="888" y="818" width="218" height="36" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="902" y="842"><tspan font-weight="700" fill="#0f172a">Docker Compose</tspan></text>
    </g>
  </g>

  <!-- external column -->
  <g>
    <rect x="1170" y="232" width="370" height="636" rx="14" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="1196" y="264" font-size="17" font-weight="700" fill="#0f172a">External services</text>
    <text x="1196" y="286" font-size="13" fill="#64748b">Third-party, called at runtime</text>

    <g font-size="13.5">
      <rect x="1196" y="304" width="318" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="1212" y="329" font-size="15" font-weight="700" fill="#0f172a">OpenStreetMap tiles</text>
      <text x="1212" y="350" fill="#475569">Basemap for Leaflet, desaturated</text>
      <text x="1212" y="369" fill="#475569">so red always means critical.</text>

      <rect x="1196" y="394" width="318" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="1212" y="419" font-size="15" font-weight="700" fill="#0f172a">OpenRouteService</text>
      <text x="1212" y="440" fill="#475569">/optimization for cleanup routes,</text>
      <text x="1212" y="459" fill="#475569">greedy nearest-neighbour fallback.</text>

      <rect x="1196" y="484" width="318" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="1212" y="509" font-size="15" font-weight="700" fill="#0f172a">Overpass / OSM extracts</text>
      <text x="1212" y="530" fill="#475569">Drains, water bodies and ward</text>
      <text x="1212" y="549" fill="#475569">polygons, loaded into PostGIS.</text>

      <rect x="1196" y="574" width="318" height="76" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="1212" y="599" font-size="15" font-weight="700" fill="#0f172a">TACO dataset</text>
      <text x="1212" y="620" fill="#475569">Litter training data. “Plastic” comes</text>
      <text x="1212" y="639" fill="#475569">from a category map, not a label.</text>
    </g>

    <rect x="1196" y="664" width="318" height="106" rx="10" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="1212" y="689" font-size="15" font-weight="700" fill="#92400e">Honesty guarantees</text>
    <text x="1212" y="711" font-size="13" fill="#92400e">· Always “likely plastic”, never “plastic”</text>
    <text x="1212" y="729" font-size="13" fill="#92400e">· Simulated demo data is badged</text>
    <text x="1212" y="747" font-size="13" fill="#92400e">· Confidence always shown with a tier</text>
    <text x="1212" y="765" font-size="13" fill="#92400e">· Never names who is responsible</text>
  </g>

  <text x="1196" y="800" font-size="15" font-weight="700" fill="#0f172a">Scale &amp; shape</text>
  <text x="1196" y="822" font-size="13" fill="#475569">8 routers · 20 services · 30 routes</text>
  <text x="1196" y="841" font-size="13" fill="#475569">129 backend tests · SPEC-frozen contract</text>
  <text x="1196" y="860" font-size="13" fill="#475569">docker-compose up → whole stack</text>

  <!-- pipeline -->
  <g>
    <rect x="60" y="890" width="1480" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="86" y="918" font-size="17" font-weight="700" fill="#0f172a">What happens to one photo</text>
    <text x="313" y="918" font-size="14" fill="#64748b">— the report pipeline, in order</text>

    <g font-size="13" text-anchor="middle">
      <rect x="86" y="932" width="168" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="170" y="955" font-weight="700" fill="#0f172a">1 · Photo in</text>
      <text x="170" y="975" fill="#475569">GPS / EXIF / pin</text>

      <rect x="274" y="932" width="168" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="358" y="955" font-weight="700" fill="#0f172a">2 · Quality gate</text>
      <text x="358" y="975" fill="#475569">blur &amp; darkness</text>

      <rect x="462" y="932" width="168" height="60" rx="9" fill="#ecfeff" stroke="#0d9488" stroke-width="1.5"/>
      <text x="546" y="955" font-weight="700" fill="#0f766e">3 · Detect</text>
      <text x="546" y="975" fill="#475569">YOLO11s inference</text>

      <rect x="650" y="932" width="168" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="734" y="955" font-weight="700" fill="#0f172a">4 · Dedupe</text>
      <text x="734" y="975" fill="#475569">pHash + radius</text>

      <rect x="838" y="932" width="168" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="922" y="955" font-weight="700" fill="#0f172a">5 · Cluster</text>
      <text x="922" y="975" fill="#475569">into a hotspot</text>

      <rect x="1026" y="932" width="168" height="60" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="1110" y="955" font-weight="700" fill="#0f172a">6 · Score</text>
      <text x="1110" y="975" fill="#475569">rank by Impact</text>

      <rect x="1214" y="932" width="300" height="60" rx="9" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
      <text x="1364" y="955" font-weight="700" fill="#0f766e">7 · Human verification gate</text>
      <text x="1364" y="975" fill="#475569">no auto-verify · no auto-resolve</text>
    </g>

    <g stroke="#0d9488" stroke-width="2" marker-end="url(#art)" fill="none">
      <path d="M258,962 L270,962"/><path d="M446,962 L458,962"/><path d="M634,962 L646,962"/>
      <path d="M822,962 L834,962"/><path d="M1010,962 L1022,962"/><path d="M1198,962 L1210,962"/>
    </g>
  </g>
</svg>
